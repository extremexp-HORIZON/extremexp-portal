name: Checking Experiment Server

on:
  push:
    branches: [main]
    paths:
      - "experiment-server/**"
      - ".github/workflows/experiment-server-check.yaml"
  pull_request:
    paths:
      - "experiment-server/**"
      - ".github/workflows/experiment-server-check.yaml"

jobs:
  check-experiment-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: extremexp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: experiment-server
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: experiment-server

      - name: Run Pyright
        uses: jakebailey/pyright-action@v2
        with:
          pylance-version: latest-release
          working-directory: experiment-server
          python-path: .venv/bin/python

      - name: Run Tests
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/extremexp
