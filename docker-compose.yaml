services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
    networks:
      - extremexp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_USER_PASSWORD}
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./extremexp-keycloak-import:/opt/keycloak/data/import
    command: start-dev --import-realm --verbose
    networks:
      - extremexp_network

  portal-server:
    build: ./portal-server
    container_name: portal-server
    environment:
      EXTREMEXP_AUTH_URL: http://access-control-service:5521/extreme_auth/api/v1/person/userinfo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgresql
    healthcheck:
      test: curl --fail http://localhost:5050/healthz || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      - "8000:8000"
    depends_on:
      access-control-service:
        condition: service_started
      emf-cloud-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      proxy-service:
        condition: service_started
    networks:
      - extremexp_network

  dms:
    build: ./extremexp-dms
    container_name: dms
    environment:
      SERVER_PORT: 8866
      JAVA_OPTS: -Xms256m -Xmx1g
    restart: unless-stopped
    networks:
      - extremexp_network

  filesystem-sync:
    build: ./filesystem-sync
    container_name: filesystem-sync
    environment:
      WORKSPACE_PATH: /workspace
      POSTGRES_HOST: postgresql
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DMS_SERVICE_URL: http://dms:8866/api
      EMF_SERVICE_URL: http://emf-cloud-service:8081/api/v2
      SYNC_MODE: warn
      LOG_LEVEL: INFO
    volumes:
      - ./workspace:/workspace
    depends_on:
      postgresql:
        condition: service_healthy
      dms:
        condition: service_started
      emf-cloud-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - extremexp_network

  emf-cloud-service:
    build: ./server-emf-cloud
    container_name: emf-cloud-service
    ports:
      - "8081:8081"
    healthcheck:
      test: curl --fail http://localhost:8081/api/v2/models || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    networks:
      - extremexp_network

  web-app:
    build: ./web-app
    container_name: web-app
    ports:
      - "7001:8080"
    networks:
      - extremexp_network

  nginx:
    image: nginx:latest
    container_name: nginx-servers
    ports:
      - "8082:80"
    depends_on:
      - web-app
      - access-control-service
      - portal-server
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - extremexp_network

  proxy-service:
    image: ghcr.io/yagorezende/extremexp-abacproxy:latest
    container_name: proxy-service
      # flask requires SIGINT to stop gracefully
      # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    ports:
      - ${PROXY_APP_PORT}:${PROXY_APP_PORT}
    expose:
      - ${PROXY_APP_PORT}
    environment:
      - FLASK_APP_HOST=${PROXY_APP_HOST}
      - FLASK_APP_PORT=${PROXY_APP_PORT}
      - FLASK_APP_NAME=${PROXY_APP_NAME}
      - FLASK_APP_DEBUG=${PROXY_APP_DEBUG}
      - FLASK_APP_ENV=${PROXY_APP_ENV}
      - FLASK_APP_SECRET_KEY=${PROXY_APP_SECRET_KEY}
      - FLASK_APP_DATABASE_URI=${PROXY_APP_DATABASE_URI}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_USERNAME=${KEYCLOAK_USERNAME}
      - KEYCLOAK_USER_PASSWORD=${KEYCLOAK_USER_PASSWORD}
      - OIDC_OP_AUTHORIZATION_ENDPOINT=${OIDC_OP_AUTHORIZATION_ENDPOINT}
      - OIDC_OP_ENDSESSION_ENDPOINT=${OIDC_OP_ENDSESSION_ENDPOINT}
      - OIDC_OP_JWKS_ENDPOINT=${OIDC_OP_JWKS_ENDPOINT}
      - OIDC_OP_LOGOUT_ENDPOINT=${OIDC_OP_LOGOUT_ENDPOINT}
      - OIDC_OP_LOGOUT_URL_METHOD=${OIDC_OP_LOGOUT_URL_METHOD}
      - OIDC_OP_TOKEN_ENDPOINT=${OIDC_OP_TOKEN_ENDPOINT}
      - OIDC_OP_USER_ENDPOINT=${OIDC_OP_USER_ENDPOINT}
      - OIDC_RP_CLIENT_ID=${OIDC_RP_CLIENT_ID}
      - OIDC_RP_REALM_ID=${OIDC_RP_REALM_ID}
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET}
      - OIDC_RP_SIGN_ALGO=${OIDC_RP_SIGN_ALGO}
    networks:
      - extremexp_network

  access-control-service:
    image: ghcr.io/yagorezende/extremexp_accesscontrol:latest
    container_name: access-control-service
    ports:
      - ${FLASK_AC_APP_PORT}:${FLASK_AC_APP_PORT}
    expose:
      - ${FLASK_AC_APP_PORT}
    environment:
      - FLASK_AC_APP_HOST=${FLASK_AC_APP_HOST}
      - FLASK_AC_APP_PORT=${FLASK_AC_APP_PORT}
      - FLASK_AC_APP_NAME=${FLASK_AC_APP_NAME}
      - FLASK_AC_APP_DEBUG=${FLASK_AC_APP_DEBUG}
      - FLASK_AC_APP_ENV=${FLASK_AC_APP_ENV}
      - FLASK_AC_APP_SECRET_KEY=${FLASK_AC_APP_SECRET_KEY}
      - FLASK_AC_APP_DATABASE_URI=${FLASK_AC_APP_DATABASE_URI}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_USERNAME=${KEYCLOAK_USERNAME}
      - KEYCLOAK_USER_PASSWORD=${KEYCLOAK_USER_PASSWORD}
      - OIDC_OP_AUTHORIZATION_ENDPOINT=${OIDC_OP_AUTHORIZATION_ENDPOINT}
      - OIDC_OP_ENDSESSION_ENDPOINT=${OIDC_OP_ENDSESSION_ENDPOINT}
      - OIDC_OP_JWKS_ENDPOINT=${OIDC_OP_JWKS_ENDPOINT}
      - OIDC_OP_LOGOUT_ENDPOINT=${OIDC_OP_LOGOUT_ENDPOINT}
      - OIDC_OP_LOGOUT_URL_METHOD=${OIDC_OP_LOGOUT_URL_METHOD}
      - OIDC_OP_TOKEN_ENDPOINT=${OIDC_OP_TOKEN_ENDPOINT}
      - OIDC_OP_USER_ENDPOINT=${OIDC_OP_USER_ENDPOINT}
      - OIDC_RP_CLIENT_ID=${OIDC_RP_CLIENT_ID}
      - OIDC_RP_REALM_ID=${OIDC_RP_REALM_ID}
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET}
      - OIDC_RP_SIGN_ALGO=${OIDC_RP_SIGN_ALGO}
    command: python app.py
    networks:
      - extremexp_network

networks:
  extremexp_network:
    driver: bridge
    name: extremexp_network

volumes:
  mongo_data:
  keycloak_data:
  postgresql_data:
