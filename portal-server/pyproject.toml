[project]
name = "portal-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.27",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "uvicorn>=0.32.0",
    "bacinet>=0.0.6",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "uuid6>=2025.0.1",
    "structlog>=25.5.0",
    "rich>=14.2.0",
    "sse-starlette>=3.0.3",
    "asyncpg-listen>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=1.3.0",
    "httpx-sse>=0.4.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
